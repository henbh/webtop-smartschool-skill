[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "webtop-mcp"
version = "0.1.0"
description = "Local read-only MCP server for the Israeli Webtop student portal"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "pywebtop>=0.0.2",
]

[project.scripts]
webtop-mcp = "webtop_mcp.server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

